# The gate for every push and pull request.
#
# Two jobs, because the package has two tiers of tests that check different
# things (see tools/run_tests.R):
#
#   check   - R CMD check on Windows, macOS and Linux. Runs tests/testthat
#             against the installed package. The package is meant to behave
#             identically on all three, so a single-platform gate would not
#             show that; the matrix is the point, not redundancy.
#   harness - the deep tests/*.R science suite. Linux only and slower, so it
#             does not need to fan out across platforms to be useful.
#
# COST GATING (added when the repositories moved back to private).
# On a public repository Actions minutes are free, so everything ran on
# everything. Private repositories are billed with platform multipliers --
# macOS x10, Windows x2, Linux x1 -- and measured against this repo's own runs a
# full pass costs about 130 billable minutes:
#
#     deep harness        76.3 real x1  =  76.3
#     macOS check          3.5 real x10 =  35.2   <- 27% of the bill for 3% of the time
#     windows check        3.6 real x2  =   7.2
#     ubuntu check         5.2 real x1  =   5.2
#     tarball (releases)   6.5 real x1  =   6.5
#
# At 130 min a run the 2,000-minute free allowance is ~15 runs a month, which is
# less than this project's actual merge rate. Two filters fix that without
# weakening the science gate:
#
#   1. PATH FILTER. Documentation-only changes (README, VALIDATED_STATE.md,
#      docs/**) skip the expensive work. Several recent PRs were docs-only and
#      each one cost a full 130 minutes.
#   2. PLATFORM FILTER. Pull requests do the real work on Linux only; macOS and
#      Windows do their real work on pushes to main and on tags. Cross-platform
#      breakage is real but rare, and it is caught before a release.
#
# IMPORTANT -- WHY THE JOBS STILL RUN INSTEAD OF BEING SKIPPED.
# The branch ruleset requires four status checks BY NAME. A job skipped with a
# job-level `if:` never reports its context at all, so branch protection waits
# forever and the merge API refuses with 405 -- which is exactly what happened
# on the first attempt at this change. So every job still starts and still
# reports; the filters are applied to the STEPS inside. A skipped leg therefore
# costs only runner startup (a few seconds) instead of its full run, and branch
# protection keeps working untouched.
#
# The deep harness is deliberately NOT reduced on pull requests. It is the job
# that has actually caught regressions here -- including one that all three
# platform checks passed -- so it still runs on every code-touching PR. What
# changed is that it no longer runs for a README edit.
name: R-CMD-check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Force the full three-OS matrix and the harness'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Decide what this event needs to run. Kept as a plain git diff rather than a
  # third-party path-filter action: it is auditable, has no supply-chain
  # surface, and this repo already prefers explicit code over dependencies.
  scope:
    runs-on: ubuntu-latest
    name: decide scope
    outputs:
      code: ${{ steps.decide.outputs.code }}
      allplat: ${{ steps.decide.outputs.allplat }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.full }}"

          # --- does this change touch anything that can alter behaviour? ---
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only "$BASE" "$HEAD")
          elif [ "$EVENT" = "push" ] && [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            FILES=""      # tags, first push, manual runs: treat as code
          fi

          if [ -z "$FILES" ]; then
            CODE=true
          else
            # Anything outside these documentation paths counts as code. The
            # default is deliberately "code": a new top-level file we have not
            # thought about should run the full gate, not skip it.
            if echo "$FILES" | grep -qvE '^(README\.md|VALIDATED_STATE\.md|BENCHMARK_NOTES\.md|VALIDATION_PROTOCOL\.md|FRAMEWORK\.md|CLAUDE\.md|LICENSE|\.gitignore|docs/)'; then
              CODE=true
            else
              CODE=false
            fi
          fi
          [ "$FORCE" = "true" ] && CODE=true

          # --- how wide should the platform matrix be? ---
          # Do the non-Linux legs do real work on this event?
          if [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ALLPLAT=true
          else
            ALLPLAT=false
          fi

          echo "code=$CODE"       >> "$GITHUB_OUTPUT"
          echo "allplat=$ALLPLAT" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT code=$CODE allplat=$ALLPLAT"
          echo "changed files:"; echo "$FILES" | head -30

  check:
    needs: scope
    runs-on: ${{ matrix.config.os }}
    name: check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # The declared floor in DESCRIPTION is R (>= 4.1.0), and nothing else verifies it.
          # A base function that postdates the floor -- `%||%` arrived in 4.4.0 -- fails
          # totally on 4.1-4.3 while passing everywhere a developer is likely to look. This
          # leg is the only thing that turns the DESCRIPTION claim into a tested one.
          - {os: ubuntu-latest,  r: '4.1'}
    env:
      # This leg does real work when the change touches code AND either it is a
      # Linux leg or the event wants every platform. Otherwise the job still
      # runs and reports, but every step below is skipped.
      RUN: ${{ needs.scope.outputs.code == 'true' && (matrix.config.os == 'ubuntu-latest' || needs.scope.outputs.allplat == 'true') }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Compile and cross-check the C++ kernel against the pure-R path rather
      # than skipping it; the kernel is the part most likely to break per-platform.
      NG_TEST_CPP: '1'
    steps:
      - name: Why this leg is or is not doing work
        run: echo "code=${{ needs.scope.outputs.code }} allplat=${{ needs.scope.outputs.allplat }} RUN=$RUN"
        shell: bash

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: env.RUN == 'true'
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # Install only hard dependencies plus what the check itself needs. The
      # external comparators (PopVar, SimpleMating, genomicMateSelectR) are
      # Suggests used solely for benchmarking, guarded by requireNamespace, and
      # two of them are GitHub-only; installing them here is unnecessary and
      # would just add non-CRAN resolution to every platform. R CMD check treats
      # the resulting "suggested but not available" as a NOTE, not an error.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.RUN == 'true'
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown

      - uses: r-lib/actions/check-r-package@v2
        if: env.RUN == 'true'
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'

  harness:
    needs: scope
    runs-on: ubuntu-latest
    name: deep harness (tests/*.R)
    env:
      RUN: ${{ needs.scope.outputs.code }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # AlphaSimR's default thread count perturbs realized QTL/recombination
      # outcomes under the same seed, which would make runs non-reproducible.
      NG_ALPHASIMR_THREADS: '1'
    steps:
      - name: Why this job is or is not doing work
        run: echo "code=${{ needs.scope.outputs.code }} RUN=$RUN"
        shell: bash

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: env.RUN == 'true'
        with:
          r-version: 'release'
          use-public-rspm: true

      # The harness needs the CRAN science stack (AlphaSimR drives many scripts)
      # but not the GitHub-only comparators; scripts that use those skip when the
      # package is absent, exactly as they do without them installed locally.
      # PopVar is on CRAN, so its comparison paths do run here.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.RUN == 'true'
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::AlphaSimR
            any::sommer
            any::Matrix
            any::mvtnorm
            any::openxlsx
            any::RhpcBLASctl
            any::ggplot2
            any::scales
            any::patchwork
            any::PopVar

      - name: Install the package
        if: env.RUN == 'true'
        run: R CMD INSTALL --no-build-vignettes .
        shell: bash

      - name: Run both tiers
        if: env.RUN == 'true'
        run: Rscript tools/run_tests.R
        shell: bash
